workflows:
  android:
    name: Build ClipFlow Android APK
    instance_type: mac_mini
    max_build_duration: 20
    environment:
      flutter: 3.22.0
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
